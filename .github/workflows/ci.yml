name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests with coverage
        run: cargo llvm-cov --tests --ignore-filename-regex '(tests|benches)/' --lcov --output-path lcov.info

      - name: Enforce 100% line coverage
        run: cargo llvm-cov report --ignore-filename-regex '(tests|benches)/' --fail-under-lines 100 --summary-only

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          flags: unittests
          fail_ci_if_error: true

  bench:
    name: Benchmark smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Run every benchmark once
        run: cargo bench --bench schemes -- --test
