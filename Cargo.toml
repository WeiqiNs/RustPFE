[package]
name = "pfe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Function-hiding inner-product and quadratic functional encryption over arkworks pairings."
repository = "https://github.com/WeiqiNs/RustPFE"
publish = false

[dependencies]
ark-ec = "0.6"
ark-ff = { version = "0.6", features = ["asm"] }
ark-serialize = "0.6"
ark-std = { version = "0.6", features = ["getrandom"] }
rayon = { version = "1", optional = true }

[dev-dependencies]
ark-bls12-381 = "0.6"
ark-bn254 = "0.6"
criterion = "0.8"
rayon = "1"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "ark-ec/parallel", "ark-ff/parallel", "ark-std/parallel"]

[[bench]]
name = "schemes"
harness = false
